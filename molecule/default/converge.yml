---
- name: Include roles
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

# This seems needed due to molecule timing out in Github Actions
- name: Relax systemd start timeout
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Set TimeoutStartSec=0 for Wazuh services
      ansible.builtin.lineinfile:
        path: "/etc/systemd/system/{{ item }}.service"
        insertafter: "^Type=simple"
        line: "TimeoutStartSec=0"
      loop:
        - wazuh-indexer
        - wazuh-manager
        - wazuh-dashboard

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Ensure Wazuh services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Start wazuh-indexer service
      ansible.builtin.systemd_service:
        name: wazuh-indexer.service
        state: started

    - name: Start wazuh-manager service
      ansible.builtin.systemd_service:
        name: wazuh-manager.service
        state: started

    - name: Start wazuh-dashboard service
      ansible.builtin.systemd_service:
        name: wazuh-dashboard.service
        state: started
