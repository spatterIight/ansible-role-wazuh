---
- name: Apply devture base roles and Wazuh role
  hosts: all
  become: true
  gather_facts: true
  vars:
    wazuh_indexer_admin_password: "iqQrFq4IMkfzjiubx8Oh8XP4v203AekQV3l0tXXeOwWEpsusV9CUEvYpy1RRjVcP"
    wazuh_indexer_kibanaserver_password: "QTHhi4v9IrlaiSZ9LZUF79jK52PjkqP0WRAJnbdR2kMDN9qMgcW0eiQhlCA6cMF7"
    wazuh_manager_api_password: "25j1QFgBfzhIJlrHV5nElZKHXTfwG2CwwtlVzgGWn4EVV3w2Y9GmWgqRE4vgnU1T"
    wazuh_manager_indexer_password: "DH74VWvso920erbyZV80XcfEqkIdGjo9PzY0r17c3IGoao1A8KntZaqSHs3Hjw1T"

    wazuh_indexer_admin_password_salt: "3tYCPUOl9UOjLWVjKptmvf"
    wazuh_indexer_kibanaserver_password_salt: "xRA72EkyJEHeYwM4jSxVK6"

    wazuh_dashboard_container_labels_traefik_enabled: false
    wazuh_dashboard_http_host_bind_port: "80"
  tasks:
    - name: Include roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Start Wazuh services
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Start wazuh-indexer service
      ansible.builtin.systemd:
        name: wazuh-indexer.service
        state: started
        daemon_reload: true

    - name: Start wazuh-manager service
      ansible.builtin.systemd:
        name: wazuh-manager.service
        state: started

    - name: Start wazuh-dashboard service
      ansible.builtin.systemd:
        name: wazuh-dashboard.service
        state: started
