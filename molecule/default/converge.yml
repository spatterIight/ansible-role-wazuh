---
- name: Include roles
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Wazuh services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - block:
        - name: Start wazuh-indexer service
          ansible.builtin.systemd_service:
            name: wazuh-indexer.service
            state: started
            daemon_reload: true

        - name: Start wazuh-manager service
          ansible.builtin.systemd_service:
            name: wazuh-manager.service
            state: started

        - name: Start wazuh-dashboard service
          ansible.builtin.systemd_service:
            name: wazuh-dashboard.service
            state: started
      always:
        - shell: journalctl -u wazuh-indexer.service
          register: temp1

        - shell: journalctl -u wazuh-manager.service
          register: temp2

        - shell: journalctl -u wazuh-dashboard.service
          register: temp3

        - debug:
            var: temp1

        - debug:
            var: temp2

        - debug:
            var: temp3
