---
- name: Apply devture base roles and Wazuh role
  hosts: all
  become: true
  gather_facts: true
  vars:
    wazuh_indexer_admin_password: "c8ww87xpBnC0ao1p3WL1OCoCGXwgCDYpa11cjT1Y3dP1xY6g7zUyGZSNgafDrTKx!"
    wazuh_indexer_kibanaserver_password: "EZBcxkhqV6gsaKZPg6wJGG66TUqJXpmFCHs1xSNsVoRsoue7ZpEzj9kR2G7Wz8Vo!"
    wazuh_manager_api_password: "Cw7pBmlsnBGXreGfVN8GGrwoYvI03D3XuvEMo6MJ53nhez7tqElJPmitz2At5Ot7!"
    wazuh_manager_indexer_password: "n6geLHT4nh7RqboBBEERckah8kqVlvGriXKqXrgtDeOTIErx5KAEKcdEpOVQMZve!"

    wazuh_indexer_admin_password_salt: "3tYCPUOl9UOjLWVjKptmvf"
    wazuh_indexer_kibanaserver_password_salt: "xRA72EkyJEHeYwM4jSxVK6"

    wazuh_dashboard_container_labels_traefik_enabled: false
    wazuh_dashboard_http_host_bind_port: "80"
  tasks:
    - name: Include roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Start Wazuh services
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Start wazuh-indexer service
      ansible.builtin.systemd:
        name: wazuh-indexer.service
        state: started
        daemon_reload: true

    - name: Start wazuh-manager service
      ansible.builtin.systemd:
        name: wazuh-manager.service
        state: started

    - name: Start wazuh-dashboard service
      ansible.builtin.systemd:
        name: wazuh-dashboard.service
        state: started
