---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  # The name carries both the role and the scenario, so that a parallel run of
  # another role's scenario cannot collide with this container.
  - name: wazuh-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Nearly every value below is deliberately different from the role's
        # own default, so that a value observed on the running stack can be
        # told apart from one the container image or the role default
        # produced. See molecule/README.md.

        wazuh_indexer_admin_password: "c8ww87xpBnC0ao1p3WL1OCoCGXwgCDYpa11cjT1Y3dP1xY6g7zUyGZSNgafDrTK!"
        wazuh_indexer_kibanaserver_password: "EZBcxkhqV6gsaKZPg6wJGG66TUqJXpmFCHs1xSNsVoRsoue7ZpEzj9kR2G7Wz8V!"
        wazuh_manager_api_password: "Cw7pBmlsnBGXreGfVN8GGrwoYvI03D3XuvEMo6MJ53nhez7tqElJPmitz2At5Ot!"

        wazuh_indexer_admin_password_salt: "3tYCPUOl9UOjLWVjKptmvf"
        wazuh_indexer_kibanaserver_password_salt: "xRA72EkyJEHeYwM4jSxVK6"

        # A single-node OpenSearch on a CI runner. The role's default of 1g
        # would be refused alongside the manager and the dashboard.
        wazuh_indexer_opensearch_java_opts: "-Xms512m -Xmx512m"

        # Not the role's default of 5601. verify.yml reaches the dashboard
        # through the host bind port below, which is mapped to this container
        # port - so if this value failed to reach `server.port` in the rendered
        # opensearch_dashboards.yml, the dashboard would listen on 5601 and
        # nothing would answer on the published port.
        wazuh_dashboard_http_port: 5602
        wazuh_dashboard_http_host_bind_port: "127.0.0.1:5699"

        # Published so that verify.yml can talk to the indexer and the manager
        # API directly. Both are deliberately not the in-container port.
        wazuh_indexer_http_host_bind_port: "127.0.0.1:9299"
        wazuh_manager_api_host_bind_port: "127.0.0.1:55099"

        # Traefik labels are on (the role's default), with a path prefix, so
        # that the strip-prefix and slashless-redirect middlewares render too.
        wazuh_hostname: wazuh.molecule.local
        wazuh_path_prefix: /wazuh
        wazuh_dashboard_container_labels_traefik_docker_network: wazuh-molecule-traefik
        wazuh_dashboard_container_labels_traefik_priority: 4711

        # Agent enrollment, remote agent configuration, custom rules and custom
        # integrations - the manager-side features.
        wazuh_enrollment_password: eHpdDqve4PdYlmEtcLRnWzP2yEVDGMv3oUKlwsVrev81EQxHD2Rpm37HfDCnuk2X

        wazuh_agent_conf: |
          <agent_config name="92603de31548">
            <labels>
              <label key="aws.instance-id">i-052a1838c</label>
              <label key="network.ip">172.17.0.0</label>
            </labels>
          </agent_config>

        wazuh_rules:
          - file: local_rules.xml
            contents: |
              <group name="local,">
                <rule id="100001" level="3">
                  <description>Custom rule example</description>
                </rule>
              </group>

        wazuh_integrations:
          - name: custom-element
            src: "{{ role_path }}/files/integrations/element/custom-element"
            mode: "0750"
          - name: custom-element.py
            src: "{{ role_path }}/files/integrations/element/custom-element.py"
            mode: "0750"

        # prepare.yml creates these files. They exercise both accepted shapes
        # of the additional-volumes lists: the documented `options` key and the
        # `readonly` key this role used to be the only one to accept.
        wazuh_manager_container_additional_volumes_custom:
          - type: bind
            src: /molecule-extra/manager-marker.txt
            dst: /molecule-extra/manager-marker.txt
            options: readonly
        wazuh_dashboard_container_additional_volumes_custom:
          - type: bind
            src: /molecule-extra/dashboard-marker.txt
            dst: /molecule-extra/dashboard-marker.txt
            readonly: true

        # The base wazuh_manager.conf this role ships already carries the
        # indexer URL and so cannot tell a rendered ossec.conf apart from the
        # shipped one. This custom replacement can: nothing but the XPath
        # machinery in tasks/install_manager.yml could have produced it.
        wazuh_manager_ossec_xml_replacements_custom:
          - xpath: /ossec_config/global/email_from
            value: molecule-wazuh@example.invalid

        wazuh_manager_container_extra_arguments:
          - "--label=molecule.extra-argument=manager"
        wazuh_dashboard_container_extra_arguments_custom:
          - "--label=molecule.extra-argument=dashboard"
  env:
    # This is a hack to resolve https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
