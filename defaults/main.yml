  #       ip: 10.0.0.5

wazuh_certs_yml_extension: "{{ wazuh_certs_yml_extension_yaml | from_yaml if wazuh_certs_yml_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final Wazuh certificate generation configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `wazuh_certs_yml_yaml`.
wazuh_certs_yml: "{{ wazuh_certs_yml_yaml | from_yaml | combine(wazuh_certs_yml_extension, recursive=True) }}"

########################################################################
#                                                                      #
# /certs                                                               #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# agent enrollment & rules                                             #
#                                                                      #
########################################################################

# Set to a non-empty string to enable password-based agent enrollment.
wazuh_enrollment_password: ""

# List of custom rules to deploy to the manager. Each item must have a `file` name and `contents`.
#
# Example:
# wazuh_rules:
#   - file: local_rules.xml
#     contents: |
#       <group name="local,">
#         <rule id="100001" level="3">
#           <description>Custom rule example</description>
#         </rule>
#       </group>
wazuh_rules: []

# Content for shared/default/agent.conf (injected verbatim inside <agent_config>…</agent_config>)
wazuh_agent_labels_conf: ""

########################################################################
#                                                                      #
# /agent enrollment & rules                                            #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# integrations                                                         #
#                                                                      #
########################################################################

# List of custom integrations to deploy to the manager's integrations directory.
# Each item must have a `name` (destination filename) and `src` (path to the file on the controller).
# `mode` is optional and defaults to "0750".
#
# Example:
# wazuh_integrations:
#   - name: custom-element
#     src: /path/on/controller/custom-element
#     mode: "0750"
wazuh_integrations: []

########################################################################
#                                                                      #
# /integrations                                                        #
#                                                                      #
########################################################################
